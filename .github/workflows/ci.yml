name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  debian:
    name: Test and package Debian / Ubuntu (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1 desktop-file-utils
      - name: Validate desktop launcher
        run: desktop-file-validate packaging/nalanda.desktop
      - name: Test all crates, including desktop
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p nalanda-desktop -p nalanda-server
      - name: Package desktop and server
        run: |
          cargo install cargo-deb --version 3.6.2 --locked
          mkdir -p dist
          cargo deb -p nalanda-desktop --no-build --output dist/
          tar -czf dist/nalanda-server-linux-x86_64.tar.gz LICENSE README.md \
            -C target/release nalanda-server
      - name: Smoke-test Debian installation
        run: |
          sudo apt-get install -y ./dist/*.deb
          command -v nalanda
          dpkg-query -W nalanda
          ldd /usr/bin/nalanda | tee /tmp/nalanda-ldd
          if grep -q 'not found' /tmp/nalanda-ldd; then exit 1; fi
          desktop-file-validate /usr/share/applications/nalanda.desktop
          target/release/nalanda-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian
          path: dist/*
          if-no-files-found: error

  arch:
    name: Test and package Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      # Kept outside makepkg's srcdir so actions/cache can carry them between runs.
      CARGO_HOME: /var/cache/nalanda/cargo
      CARGO_TARGET_DIR: /var/cache/nalanda/target
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust clang cmake pkgconf openssl zstd \
            fontconfig freetype2 libx11 libxcb libxkbcommon libxkbcommon-x11 \
            wayland vulkan-icd-loader desktop-file-utils sudo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            /var/cache/nalanda/cargo/registry
            /var/cache/nalanda/cargo/git
            /var/cache/nalanda/target
          key: arch-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-cargo-${{ steps.rust.outputs.version }}-
      - name: Build package from this exact checkout
        shell: bash
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" /home/builder/nalanda
          mkdir /home/builder/package
          cp packaging/arch/PKGBUILD /home/builder/package/
          # Test unmerged changes too, rather than cloning the public default branch.
          sed -i 's|git+https://github.com/ninad-bhangui/nalanda.git|git+file:///home/builder/nalanda|' /home/builder/package/PKGBUILD
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chown -R builder:builder /home/builder /var/cache/nalanda
          sudo --preserve-env=CARGO_HOME,CARGO_TARGET_DIR,CARGO_PROFILE_DEV_DEBUG,CARGO_PROFILE_TEST_DEBUG,CARGO_TERM_COLOR \
            -u builder bash -c 'cd /home/builder/package && makepkg --syncdeps --noconfirm'
      - name: Smoke-test Arch installation
        shell: bash
        run: |
          pacman -U --noconfirm /home/builder/package/*.pkg.tar.zst
          command -v nalanda
          nalanda-server --help
          ldd /usr/bin/nalanda | tee /tmp/nalanda-ldd
          if grep -q 'not found' /tmp/nalanda-ldd; then exit 1; fi
          desktop-file-validate /usr/share/applications/nalanda.desktop
          mkdir -p dist
          cp /home/builder/package/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
