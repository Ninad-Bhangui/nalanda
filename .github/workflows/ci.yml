name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The only job that compiles. Built on the oldest supported distro so the
  # binaries' glibc requirement is satisfied by every newer one, Arch included.
  build:
    name: Build, test and package Debian / Ubuntu (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1 desktop-file-utils
      - name: Validate desktop launcher
        run: desktop-file-validate packaging/nalanda.desktop
      - name: Build release binaries
        run: cargo build --release --locked -p nalanda-desktop -p nalanda-server
      # Release mode reuses the dependencies built above instead of compiling
      # the whole graph a second time without optimizations.
      - name: Test all crates, including desktop
        run: cargo test --workspace --release --locked
      - name: Package desktop and server
        run: |
          cargo install cargo-deb --version 3.6.2 --locked
          mkdir -p dist
          cargo deb -p nalanda-desktop --no-build --output dist/
          tar -czf dist/nalanda-server-linux-x86_64.tar.gz LICENSE README.md \
            -C target/release nalanda-server
          # A tarball keeps the executable bits that upload-artifact drops.
          tar -cf binaries.tar -C target/release nalanda nalanda-server
      - name: Smoke-test Debian installation
        run: |
          sudo apt-get install -y ./dist/*.deb
          command -v nalanda
          dpkg-query -W nalanda
          ldd /usr/bin/nalanda | tee /tmp/nalanda-ldd
          if grep -q 'not found' /tmp/nalanda-ldd; then exit 1; fi
          desktop-file-validate /usr/share/applications/nalanda.desktop
          target/release/nalanda-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries.tar
          if-no-files-found: error

  arch:
    name: Package and smoke-test Arch Linux (x86_64)
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed fontconfig freetype2 libx11 libxcb libxkbcommon \
            libxkbcommon-x11 wayland vulkan-icd-loader desktop-file-utils sudo
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Package the Ubuntu-built binaries
        shell: bash
        run: |
          useradd -m builder
          mkdir /home/builder/package
          tar -xf binaries.tar -C /home/builder/package
          cp packaging/arch/PKGBUILD-bin packaging/nalanda.desktop README.md /home/builder/package/
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          sed -i "s/^pkgver=.*/pkgver=$version/" /home/builder/package/PKGBUILD-bin
          chown -R builder:builder /home/builder
          sudo -u builder bash -c 'cd /home/builder/package && makepkg -p PKGBUILD-bin --noconfirm'
      - name: Smoke-test Arch installation
        shell: bash
        run: |
          pacman -U --noconfirm /home/builder/package/*.pkg.tar.zst
          command -v nalanda
          nalanda-server --help
          ldd /usr/bin/nalanda | tee /tmp/nalanda-ldd
          if grep -q 'not found' /tmp/nalanda-ldd; then exit 1; fi
          desktop-file-validate /usr/share/applications/nalanda.desktop
          mkdir -p dist
          cp /home/builder/package/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
