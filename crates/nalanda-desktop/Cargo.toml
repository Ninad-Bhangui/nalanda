[package]
name = "nalanda-desktop"
description = "Nalanda desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nalanda"
path = "src/main.rs"

[dependencies]
nalanda-core.workspace = true
nalanda-formats.workspace = true
nalanda-library.workspace = true
nalanda-convert.workspace = true
nalanda-device.workspace = true
nalanda-server.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
smallvec = "1"

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
name = "nalanda"
maintainer = "Nalanda contributors"
copyright = "Nalanda contributors"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto, libx11-6, libx11-xcb1, libwayland-client0, libwayland-cursor0, libvulkan1"
recommends = "xdg-desktop-portal"
suggests = "calibre"
assets = [
    ["target/release/nalanda", "usr/bin/", "755"],
    ["../../packaging/nalanda.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/nalanda/README.md", "644"],
]
