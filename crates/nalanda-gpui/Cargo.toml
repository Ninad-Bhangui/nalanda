[package]
name = "nalanda-gpui"
description = "Nalanda GPUI desktop app (benchmark comparison)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nalanda-gpui"
path = "src/main.rs"

[dependencies]
nalanda-core.workspace = true
nalanda-formats.workspace = true
nalanda-library.workspace = true
nalanda-convert.workspace = true
nalanda-device.workspace = true
nalanda-server.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
smallvec = "1"

[dev-dependencies]
tempfile.workspace = true
