[package]
name = "nalanda-server"
description = "HTTP API (JSON + OPDS) over a Nalanda library, for mobile and remote clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nalanda-server"
path = "src/main.rs"

[dependencies]
nalanda-core.workspace = true
nalanda-library.workspace = true
nalanda-convert.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
nalanda-formats.workspace = true
